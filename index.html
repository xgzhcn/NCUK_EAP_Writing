  .key-grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
}
</style>

One difficulty is that it is hard to determine which jobs are being taken over by AI. For example, an accounting firm could use software to categorise expenses while keeping its staff to check unusual transactions and advise clients. Over time, recruits might spend less time entering data and more time interpreting it. A law that requires employers to show that a job has remained substantially the same could discourage this kind of reorganisation, even when the result would be better work for employees and better advice for clients.

The strongest argument for job protection arises in communities with few alternative employers. If a local company abruptly automates its operations, affected households may lose income and local businesses may also suffer. A sensible response would combine early notice of large redundancies with temporary income support and training designed with nearby employers. For instance, workers who have maintained machinery could receive a short qualification that allows them to apply for maintenance positions in a different industry. Tying courses to actual vacancies would improve the chances of finding work.

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const screen = $("#screen");
const dialog = $("#dialog");
const studentKey = PAPER + ":student";
const teacherKey = PAPER + ":teacher";
const memory = new Map();
let view = "home";
let teacherTab = "marks";
let section = 0;
let newAttempt = false;
let search = "";
let classFilter = "";
let statusFilter = "";
let analysisGroup = "";
let teacherMessage = { text:"", tone:"" };

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function warnStorage() {
  storageAvailable = false;
  const notice = $("#storage-notice");
  notice.textContent = "Browser storage is unavailable or full. Keep this tab open and download your submission or teacher backup before leaving.";
  notice.hidden = false;
}

function read(key, fallback) {
  if (memory.has(key)) return memory.get(key);
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    warnStorage();
    return fallback;
  }
}

function write(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    memory.delete(key);
  } catch {
    warnStorage();
    memory.set(key, value);
  }
}

function student() { return read(studentKey, null); }
function roster() { return read(teacherKey, []); }

function words(value) {
  return (value.match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu) || []).length;
}

function normalized(answer) { return answer.trim().toLowerCase(); }
function scoreAnswers(answers) {
  return KEY.map((accepted,i) => accepted.includes(normalized(answers[i] || "")));
}
function sectionScores(items) {
  return [0,1,2,3].map(i => items.slice(i * 10, i * 10 + 10).filter(Boolean).length);
}
function automatic(attempt) { return scoreAnswers(attempt.answers).filter(Boolean).length; }
function total(attempt) { return attempt.grade ? automatic(attempt) + attempt.grade.mark : null; }

function displayNumber(value) {
  return value === null ? "—" : new Intl.NumberFormat("en", {maximumFractionDigits:1}).format(value);
}
function markLabel(value, max) {
  return value === null ? "—" : displayNumber(value) + " / " + max;
}
function formatTime(time) {
  return new Intl.DateTimeFormat("en", {dateStyle:"medium",timeStyle:"short"}).format(time);
}
function attemptSummary(attempt) {
  const count = attempt.answers.filter(answer => answer.trim()).length;
  const essayWords = words(attempt.essay);
  return { count, essayWords, completeEssay:Boolean(attempt.topic && essayWords >= MIN_WORDS) };
}
function currentClock(deadline) {
  const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  const show = n => String(n).padStart(2,"0");
  return show(Math.floor(seconds / 3600)) + ":" + show(Math.floor(seconds / 60) % 60) + ":" + show(seconds % 60);
}
function download(name, body, type) {
  const url = URL.createObjectURL(new Blob([body], {type}));
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = name;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadSubmission(attempt) {
  const safeId = attempt.studentId.replace(/[^A-Za-z0-9_-]/g, "-").slice(0,45) || "student";
  download("EAP-" + safeId + "-" + attempt.id.slice(0,8) + ".json",
    JSON.stringify({paper:PAPER, version:1, kind:"submission", attempt}, null, 2),
    "application/json");
}

function navigate(next, scroll = true) {
  view = next;
  newAttempt = false;
  render(scroll);
}

function render(scroll = false) {
  $("#student-link").toggleAttribute("aria-current", view === "student");

  if (view === "student") renderStudent();
  else if (view === "teacher") renderTeacher();
  else renderHome();
  if (scroll) {
    window.scrollTo(0,0);
    const heading = $("h1", screen);
    if (heading) {
      heading.tabIndex = -1;
      heading.focus({preventScroll:true});
    }
  }
}

  screen.innerHTML = `
    <section class="hero" aria-labelledby="home-title">
      <div class="hero-copy">
        <p class="eyebrow">English for Academic Purposes · Semester 2</p>
        <h1 id="home-title">Writing practice paper</h1>
        <p>Work through the five sections of the 2023–24 writing paper, or review and mark submissions from your class.</p>

      </div>
      <div class="illustration" aria-hidden="true">

function gap(number, attempt, bank = false) {
  const answer = attempt.answers[number - 1];
  const control = bank
    ? `<select id="q${number}" aria-label="Question ${number}" data-answer="${number}"><option value="">Choose…</option>${BANK.map(word => `<option${word === answer ? " selected" : ""}>${word}</option>`).join("")}</select>`
    : `<input id="q${number}" type="text" aria-label="Question ${number}" data-answer="${number}" value="${escapeHTML(answer)}" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  return `<span class="gap"><span class="qnum" aria-hidden="true">${number}</span>${control}</span>`;
}

function withGaps(text, attempt, bank = false) {
  return escapeHTML(text).replace(/\{(\d+)\}/g, (_, number) => gap(Number(number), attempt, bank));
}

function renderSection(attempt) {
  if (section === 0) return `
    <p>Choose <strong>one suitable word</strong> for each gap. Use any word which is appropriate. All spelling must be correct.</p>
    <p class="example small">Example · I like apples <strong>and</strong> oranges.</p>
    <div class="passage">${OPEN_PASSAGE.map(text => "<p>" + withGaps(text, attempt) + "</p>").join("")}</div>`;
  if (section === 1) return `
    <p>Choose the most suitable word from the word bank for each gap. Each word may be used once.</p>
    <div class="word-bank" aria-label="Word bank">${BANK.map(word => `<span data-word="${word}">${word}</span>`).join("")}</div>
    <div class="passage">${BANK_PASSAGE.map(text => "<p>" + withGaps(text, attempt, true) + "</p>").join("")}</div>`;
  if (section === 2) return `
    <p>Each numbered line contains one incorrect or missing word. Enter only the missing word or its replacement. All spelling must be correct.</p>
    <div class="example small">
      <p>Example A · An ageing population occurs when a larger number / people are growing <strong>(of)</strong></p>
      <p>Example B · older and living longer. This happens because there are <u>few</u> babies <strong>(fewer)</strong></p>
    </div>
    <ol class="question-list" start="21">${CORRECTION.map((text, i) => `<li><span class="qnum" aria-hidden="true">${i+21}</span><span>${escapeHTML(text)}</span>${gap(i+21, attempt)}</li>`).join("")}</ol>
    <p class="small">and the sustainability of our societies.</p>`;
  if (section === 3) return `
    <p>Use the given word to form a new word that fits the gap. All spelling must be correct.</p>
    <p class="example small">Example · The introduction to the essay was good but the <strong>conclusion</strong> needed work. <span class="pill">conclude</span></p>
    <ol class="question-list" start="31">${FORMATION.map(([text, root], i) => `<li><span class="qnum" aria-hidden="true">${i+31}</span><span>${withGaps(text, attempt)}</span><span class="pill root">${root}</span></li>`).join("")}</ol>`;
  return `
    <p>Spend approximately 40 minutes on this task. Write at least <strong>250 words</strong>. Use your own ideas, knowledge and experience to support your argument with examples and relevant evidence.</p>
    <fieldset class="stack-tight"><legend>Choose one topic</legend>
      ${Object.entries(TOPICS).map(([letter, topic]) => `<label class="topic-card"><input type="radio" name="topic" value="${letter}"${attempt.topic === letter ? " checked" : ""}><span><strong>Topic ${letter} · ${topic.name}</strong>${escapeHTML(topic.prompt)}</span></label>`).join("")}
    </fieldset>
    <label class="field">Your essay
      <textarea id="essay" class="essay-box" maxlength="30000" spellcheck="false" autocorrect="off" aria-describedby="word-count">${escapeHTML(attempt.essay).replace(/^\n/, "&#10;")}</textarea>
    </label>
    <p class="small muted" id="word-count"></p>`;
}

function renderExam(attempt) {
  const current = SECTIONS[section];
  screen.innerHTML = `

        </nav>

        </div>
        ${renderSection(attempt)}
        <div class="exam-actions">

          <button type="button" class="btn" id="next-section">${section === 4 ? "Review &amp; submit" : "Next section →"}</button>
        </div>
      </section>
    </div>`;
  const update = (apply, repaint = false) => {
    const latest = student();
    if (latest?.id !== attempt.id || latest.status !== "active") {
      render();
      return;
    }
    if (latest.deadline <= Date.now()) {
      finalize(latest, true);
      return;

    apply(latest);
    write(studentKey, latest);
    if (repaint) {
      renderStudent();
      $("#section-title")?.scrollIntoView({block:"start"});
      $("#section-title")?.focus({preventScroll:true});
    } else refreshProgress(latest);
  };
  const go = index => update(latest => { latest.section = index; }, true);
  for (const link of $$("[data-section]", screen)) link.onclick = () => go(Number(link.dataset.section));
  $("#previous-section").onclick = () => go(section - 1);
  $("#next-section").onclick = () => section === 4 ? reviewExam() : go(section + 1);
  $("#review-exam").onclick = reviewExam;
  for (const field of $$("[data-answer]", screen)) {
    const save = () => update(latest => { latest.answers[Number(field.dataset.answer)-1] = field.value; });
    field.addEventListener(field.tagName === "SELECT" ? "change" : "input", save);
  }
  for (const topic of $$("input[name=topic]", screen)) topic.onchange = () => update(latest => { latest.topic = topic.value; });
  if ($("#essay")) $("#essay").oninput = event => update(latest => { latest.essay = event.target.value; });
  refreshProgress(attempt);
}

function refreshProgress(attempt) {
  const {essayWords, completeEssay} = attemptSummary(attempt);
  for (let i = 0; i < 4; i++) {
    const count = attempt.answers.slice(i * 10, (i + 1) * 10).filter(value => value.trim()).length;
    $(`[data-progress="${i}"]`).textContent = count + "/10";
    $(`[data-section="${i}"]`).setAttribute("aria-label", `Section ${i+1}, ${SECTIONS[i].name}, ${count} of 10 answered`);
  }
  $('[data-progress="4"]').textContent = completeEssay ? "Ready" : essayWords + " words";
  $('[data-section="4"]').setAttribute("aria-label", "Section 5, Essay writing, " + essayWords + " words");
  if ($("#word-count")) $("#word-count").textContent = essayWords + " / 250 words minimum";
  const chosen = new Set(attempt.answers.slice(10,20).filter(Boolean));
  for (const tag of $$("[data-word]", screen)) tag.classList.toggle("used", chosen.has(tag.dataset.word));
  for (const input of $$("select[data-answer]", screen)) {
    for (const option of input.options) option.disabled = chosen.has(option.value) && option.value !== input.value;
  }
  $("#save-status").textContent = storageAvailable ? "Draft saved in this browser" : "Draft held in this tab";
  $(".clock").classList.toggle("urgent", attempt.deadline - Date.now() <= 5 * 60 * 1000);

function showDialog(content, small = false) {
  if (dialog.open) dialog.close();
  dialog.classList.toggle("small-dialog", small);
  dialog.innerHTML = content;
  dialog.showModal();
  for (const button of $$("[data-close]", dialog)) button.onclick = () => dialog.close();
}

function reviewExam() {
  const attempt = student();
  if (attempt?.status !== "active") return;
  const {count, essayWords, completeEssay} = attemptSummary(attempt);
  const warnings = [];
  if (count < 40) warnings.push((40 - count) + " short-answer question(s) are blank");
  if (!attempt.topic) warnings.push("no essay topic is selected");
  if (essayWords < MIN_WORDS) warnings.push("the essay is below 250 words");
  showDialog(`
    <div class="dialog-body stack">
      <h2 id="dialog-title">Review your submission</h2>
      <p>${count} of 40 short answers entered. ${attempt.topic ? "Topic " + attempt.topic + " selected." : ""} Essay length is ${essayWords} words.</p>
      ${count < 40 || !completeEssay ? `<p class="notice warn small">Incomplete work · ${warnings.join(", ")}.</p>` : ""}

      <div class="actions"><button class="btn secondary" type="button" data-close autofocus>Keep working</button><button class="btn" type="button" id="submit-exam">Submit exam</button></div>
    </div>`, true);
  $("#submit-exam").onclick = () => {
    const latest = student();
    if (latest?.id === attempt.id && latest.status === "active") finalize(latest, Date.now() >= latest.deadline);
    else { dialog.close(); render(); }
  };
}

function finalize(attempt, timedOut) {

    id:attempt.id, studentId:attempt.studentId, studentName:attempt.studentName, group:attempt.group,
    startsAt:attempt.startsAt, submittedAt:timedOut ? attempt.deadline : Date.now(), status:"submitted", timedOut,
    answers:attempt.answers, topic:attempt.topic, essay:attempt.essay
  });

  if (view !== "teacher") render(true);
}

      <div class="actions">
        <button class="btn" id="download-submission" type="button">Download submission (.json)</button>
        <button class="btn ghost" id="start-again" type="button">Start another attempt</button>
      </div>
    </section>`;
  $("#download-submission").onclick = () => downloadSubmission(attempt);
  $("#start-again").onclick = () => { newAttempt = true; render(true); };
}

function renderTeacher() {
  const attempts = roster();
  if (classFilter && !attempts.some(item => groupMatches(item, classFilter))) classFilter = "";
  if (analysisGroup && !attempts.some(item => groupMatches(item, analysisGroup))) analysisGroup = "";
  const tabs = {marks:"Collected marks", analysis:"Performance analysis", reference:"Answer key & essays"};
  screen.innerHTML = `
    <div class="page-head">
      <div><p class="eyebrow">Teacher dashboard</p><h1>${tabs[teacherTab]}</h1>
      <p class="muted">${{
        marks:"Import student submissions, review responses and enter Section 5 marks.",
        analysis:"Review section scores, question accuracy and essay results across your class.",
        reference:"Use the supplied key for Sections 1–4 and compare two model essays for each topic."
      }[teacherTab]}</p></div>
      ${teacherTab === "marks" ? `<div class="actions">
        <input id="import-files" type="file" accept=".json,application/json" multiple hidden>
        <button type="button" class="btn" id="import-button">↑ Import JSON files</button>
      </div>` : ""}
    </div>
    <nav class="tabs" aria-label="Teacher views">${Object.entries(tabs).map(([key,label]) => `<button type="button" data-tab="${key}"${key === teacherTab ? ' aria-current="page"' : ""}>${escapeHTML(label)}</button>`).join("")}</nav>
    <p id="teacher-notice" class="notice small" role="status"></p>
    <div id="teacher-content">${teacherTab === "marks" ? marksContent(attempts) : teacherTab === "analysis" ? analysisContent(attempts) : referenceContent()}</div>`;
  for (const button of $$("[data-tab]", screen)) button.onclick = () => {
    teacherTab = button.dataset.tab;
    render(true);
  };
  refreshTeacherNotice();
  if (teacherTab === "marks") {
    $("#import-button").onclick = () => $("#import-files").click();
    $("#import-files").onchange = event => importFiles([...event.target.files]);
    if (!attempts.length) return;
    $("#roster-search").oninput = event => { search = event.target.value; refreshRows(); };
    $("#class-filter").onchange = event => { classFilter = event.target.value; refreshRows(); };
    $("#status-filter").onchange = event => { statusFilter = event.target.value; refreshRows(); };
    $("#export-csv").onclick = exportCSV;
    $("#export-backup").onclick = () => download("EAP-teacher-backup.json",
      JSON.stringify({paper:PAPER, version:1, kind:"teacher-backup", attempts:roster()}, null, 2), "application/json");
    refreshRows();
  }
  if (teacherTab === "analysis" && attempts.length) $("#analysis-class").onchange = event => {
    analysisGroup = event.target.value;
    renderTeacher();
    $("#analysis-class").focus();
  };
}

function refreshTeacherNotice() {
  const notice = $("#teacher-notice");
  if (!notice) return;
  notice.className = "notice small " + teacherMessage.tone;
  notice.textContent = teacherMessage.text;
  notice.style.marginBottom = teacherMessage.text ? "15px" : "0";
}

function empty(title, description) {
  return `<section class="empty"><h2>${title}</h2><p class="muted">${description}</p></section>`;
}

function stat(label, value, detail) {
  return `<div class="stat"><span class="small muted">${label}</span><strong>${value}</strong><span class="small muted">${detail}</span></div>`;
}

function classOptions(attempts, selected) {
  const groups = [...new Set(attempts.map(item => item.group))].sort((a,b) => a.localeCompare(b));
  return '<option value="">All classes</option>' + groups.map(group => {
    const value = "class:" + group;
    return `<option value="${escapeHTML(value)}"${value === selected ? " selected" : ""}>${escapeHTML(group || "Class unspecified")}</option>`;
  }).join("");
}

function groupMatches(attempt, filter) {
  return !filter || "class:" + attempt.group === filter;
}

function marksContent(attempts) {
  if (!attempts.length) return empty("No submissions yet",
    "Ask students to share their downloaded JSON files. You can import several files at once or restore a teacher backup.");
  const graded = attempts.filter(item => item.grade).length;
  const pending = attempts.length - graded;
  return `<div class="stack">
    <div class="stats">
      ${stat("Collected", attempts.length, "Imported attempts")}
      ${stat("Essay marked", graded, "Final mark available")}
      ${stat("Awaiting marks", pending, "Section 5 pending")}
      ${stat("Student IDs", new Set(attempts.map(item => item.studentId)).size, "Unique IDs")}
    </div>
    <section class="panel stack" aria-labelledby="roster-title">
      <div class="page-head" style="margin-bottom:0"><h2 id="roster-title">Submissions</h2>
        <div class="actions"><button type="button" class="btn secondary" id="export-csv">Export marks CSV</button><button type="button" class="btn secondary" id="export-backup">Download backup</button></div>
      </div>
      <div class="toolbar">
        <input id="roster-search" type="search" aria-label="Search by student name or ID" placeholder="Search ID or name" value="${escapeHTML(search)}">
        <select id="class-filter" aria-label="Filter by class">${classOptions(attempts, classFilter)}</select>
        <select id="status-filter" aria-label="Filter by marking status">
          <option value="">All marking statuses</option>
          <option value="pending"${statusFilter === "pending" ? " selected" : ""}>Awaiting marks</option>
          <option value="graded"${statusFilter === "graded" ? " selected" : ""}>Essay marked</option>
        </select>
      </div>
      <div id="roster-rows"></div>
      <p class="small muted">Marks are stored in this browser. The CSV exports the current selection. A JSON backup saves all responses and marks for restoration.</p>
    </section>
  </div>`;
}

function filteredRoster() {
  const term = normalized(search);
  return roster().filter(item => groupMatches(item, classFilter) &&
    (!statusFilter || statusFilter === (item.grade ? "graded" : "pending")) &&
    (!term || [item.studentId, item.studentName].some(value => normalized(value).includes(term))))
    .sort((a,b) => b.submittedAt - a.submittedAt);
}

function refreshRows() {
  const attempts = filteredRoster();
  $("#roster-rows").innerHTML = attempts.length ? `
    <div class="table-wrap"><table>
      <caption class="sr-only">Collected student marks</caption>
      <thead><tr><th scope="col">Student</th><th scope="col">Class</th><th scope="col">Sections 1–4</th><th scope="col">Essay</th><th scope="col">Total</th><th scope="col">Action</th></tr></thead>
      <tbody>${attempts.map(item => `<tr>
        <th scope="row"><strong>${escapeHTML(item.studentId)}</strong><br><span class="small muted">${escapeHTML(item.studentName) || formatTime(item.submittedAt)}</span></th>
        <td>${escapeHTML(item.group) || "—"}</td>
        <td>${markLabel(automatic(item),40)}</td>
        <td>${item.grade ? markLabel(item.grade.mark,60) : '<span class="pill pending">Pending</span>'}</td>
        <td>${markLabel(total(item),100)}</td>
        <td><button type="button" data-attempt="${item.id}" class="btn secondary" aria-label="${item.grade ? "Review marks" : "Mark essay"} for ${escapeHTML(item.studentId)}">${item.grade ? "Review" : "Mark essay"}</button></td>
      </tr>`).join("")}</tbody>
    </table></div>` : '<p class="notice small">No submissions match the current filters.</p>';
  $("#export-csv").disabled = !attempts.length;
  for (const button of $$("[data-attempt]", screen)) button.onclick = () => markAttempt(button.dataset.attempt);
}

function readAttempt(raw, allowGrade) {
  const validText = (x, max) => typeof x === "string" && x.length <= max;
  const validTime = x => Number.isSafeInteger(x) && x >= 0 && x <= 8640000000000000;
  if (!raw || typeof raw !== "object" || typeof raw.id !== "string" || !/^[0-9a-f]{32}$|^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(raw.id) ||
      raw.status !== "submitted" || !validText(raw.studentId,80) || !raw.studentId.trim() || !validText(raw.studentName,100) || !validText(raw.group,70) ||
      !validTime(raw.startsAt) || !validTime(raw.submittedAt) || raw.submittedAt < raw.startsAt || typeof raw.timedOut !== "boolean" ||
      !Array.isArray(raw.answers) || raw.answers.length !== 40 || !raw.answers.every(answer => validText(answer,80)) ||
      !["","A","B"].includes(raw.topic) || !validText(raw.essay,30000)) return null;
  const item = {
    id:raw.id.toLowerCase(), studentId:raw.studentId.trim(), studentName:raw.studentName.trim(), group:raw.group.trim(),
    status:"submitted", startsAt:raw.startsAt, submittedAt:raw.submittedAt, timedOut:raw.timedOut,
    answers:raw.answers, topic:raw.topic, essay:raw.essay
  };
  if (allowGrade && raw.grade != null) {
    const {mark, feedback, markedAt} = raw.grade;
    if (!Number.isFinite(mark) || mark < 0 || mark > 60 || Math.abs(mark * 10 - Math.round(mark * 10)) > 1e-8 ||
        !validText(feedback,3000) || !validTime(markedAt)) return null;
    item.grade = {mark, feedback, markedAt};
  }
  return item;
}

let importing = false;
async function importFiles(files) {
  if (importing || !files.length) return;
  importing = true;
  $("#import-button").disabled = true;
  teacherMessage = {text:"Reading " + files.length + " file(s)…", tone:""};
  refreshTeacherNotice();
  const parsed = [];
  const errors = [];
  let invalid = 0;
  for (const file of files) {
    try {
      if (file.size > 40 * 1024 * 1024) throw Error("File exceeds 40 MB");
      const data = JSON.parse((await file.text()).replace(/^\uFEFF/, ""));
      if (data.paper !== PAPER || data.version !== 1) throw Error("Unrecognised paper or file version");
      const backup = data.kind === "teacher-backup";
      const records = backup ? data.attempts : data.kind === "submission" ? [data.attempt] : null;
      if (!Array.isArray(records)) throw Error("Expected a submission or teacher backup");
      for (const raw of records) {
        const attempt = readAttempt(raw, backup);
        if (attempt) parsed.push(attempt);
        else invalid++;
      }
    } catch (error) {
      errors.push(file.name + " (" + (error instanceof SyntaxError ? "invalid JSON" : error.message) + ")");
    }
  }
  const existing = new Map(roster().map(item => [item.id, item]));
  let added = 0;
  let duplicate = 0;
  for (const attempt of parsed) {
    if (existing.has(attempt.id)) {
      duplicate++;
      continue;
    }
    existing.set(attempt.id, attempt);
    added++;
  }
  if (added) write(teacherKey, [...existing.values()]);
  const main = `Imported ${added} attempt(s). ${duplicate} duplicate(s) skipped.`;
  const detail = [
    invalid ? `${invalid} invalid submission record(s) skipped.` : "",
    errors.length ? `Could not read ${errors.slice(0,3).join(", ")}${errors.length > 3 ? " and " + (errors.length - 3) + " more file(s)" : ""}.` : ""
  ].filter(Boolean).join(" ");
  teacherMessage = {text:[main, detail].filter(Boolean).join(" "), tone:detail ? "warn" : "ok"};
  importing = false;
  if (view === "teacher") renderTeacher();
}

function csvText(value) {
  let text = String(value ?? "");
  if (typeof value === "string" && /^\s*[=+@\-]|^[\t\r\n]/.test(text)) text = "'" + text;
  return '"' + text.replaceAll('"','""') + '"';
}

function exportCSV() {
  const columns = ["Attempt ID","Student ID","Name","Class","Submitted UTC","Section 1 /10","Section 2 /10","Section 3 /10","Section 4 /10",
    "Sections 1–4 /40","Essay topic","Essay words","Section 5 /60","Total /100","Marking status","Essay feedback"];
  const rows = filteredRoster().map(item => [
    item.id, item.studentId, item.studentName, item.group, new Date(item.submittedAt).toISOString(),
    ...sectionScores(scoreAnswers(item.answers)), automatic(item), item.topic, words(item.essay), item.grade?.mark, total(item),
    item.grade ? "Marked" : "Awaiting essay mark", item.grade?.feedback
  ]);
  download("EAP-collected-marks.csv", "\uFEFF" + [columns,...rows].map(row => row.map(csvText).join(",")).join("\r\n"), "text/csv;charset=utf-8");
}

function markAttempt(id) {
  const item = roster().find(attempt => attempt.id === id);
  if (!item) return;
  const marks = scoreAnswers(item.answers);
  const subtotal = marks.filter(Boolean).length;
  const essayWords = words(item.essay);
  showDialog(`
    <div class="dialog-body stack">
      <div class="dialog-head"><div class="stack-tight">
        <p class="eyebrow">Student submission</p><h2 id="dialog-title">${escapeHTML(item.studentId)}${item.studentName ? " · " + escapeHTML(item.studentName) : ""}</h2>
        <p class="muted small">${formatTime(item.submittedAt)}${item.group ? " · " + escapeHTML(item.group) : ""}${item.timedOut ? " · Time expired" : ""}</p>
      </div><button class="btn ghost" type="button" data-close aria-label="Close submission">Close</button></div>
      <div class="form-grid">
        ${stat("Sections 1–4", markLabel(subtotal,40), sectionScores(marks).map((n,i) => "S" + (i+1) + " " + n + "/10").join(" · "))}
        ${stat("Total", markLabel(total(item),100), item.grade ? "Includes essay mark" : "Essay mark pending")}
      </div>
      <details><summary>Review all 40 short answers</summary>
        <div class="table-wrap" style="margin-top:9px"><table><thead><tr><th scope="col">Question</th><th scope="col">Response</th><th scope="col">Accepted answer</th><th scope="col">Mark</th></tr></thead>
        <tbody>${KEY.map((accepted,i) => `<tr><th scope="row">${i+1}</th><td>${escapeHTML(item.answers[i].trim()) || "—"}</td><td>${accepted.join(" / ")}</td><td>${marks[i] ? "1 / 1" : "0 / 1"}</td></tr>`).join("")}</tbody></table></div>
      </details>
      <section class="stack-tight" aria-labelledby="essay-review-title">
        <h3 id="essay-review-title">Section 5 · ${item.topic ? "Topic " + item.topic : "No topic selected"}</h3>
        ${item.topic ? "<p class='small muted'>" + escapeHTML(TOPICS[item.topic].prompt) + "</p>" : ""}
        <span class="pill${essayWords < MIN_WORDS ? " pending" : " good"}">${essayWords} words${essayWords < MIN_WORDS ? " · Below 250" : ""}</span>
        <p class="essay-copy">${escapeHTML(item.essay) || "<em>No essay was entered.</em>"}</p>
      </section>
      <form id="mark-form" class="stack">
        <div class="form-grid">
          <label class="field">Essay mark / 60
            <input type="number" name="mark" min="0" max="60" step="0.1" value="${item.grade?.mark ?? ""}" required>
          </label>
          <div class="stat"><span class="small muted">Total preview</span><strong id="preview-mark">${markLabel(total(item),100)}</strong></div>
        </div>
        <p class="small muted">Use your course’s marking criteria. The supplied answer key contains no essay scoring rubric.</p>
        <label class="field">Teacher feedback <span class="sr-only">(optional)</span><textarea name="feedback" rows="3" maxlength="3000">${escapeHTML(item.grade?.feedback || "").replace(/^\n/, "&#10;")}</textarea></label>
        <div class="actions"><button class="btn" type="submit">Save marks</button><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn danger" type="button" id="remove-attempt">Remove attempt</button></div>
      </form>
    </div>`);
  const form = $("#mark-form", dialog);
  const entry = form.elements.namedItem("mark");
  entry.oninput = () => {
    $("#preview-mark", dialog).textContent = markLabel(entry.validity.valid ? subtotal + entry.valueAsNumber : null,100);
  };
  form.onsubmit = event => {
    event.preventDefault();
    const updated = roster();
    const latest = updated.find(attempt => attempt.id === id);
    if (!latest) {
      dialog.close();
      renderTeacher();
      return;
    }
    latest.grade = {mark:entry.valueAsNumber, feedback:form.elements.namedItem("feedback").value.trim(), markedAt:Date.now()};
    write(teacherKey, updated);
    teacherMessage = {text:"Marks saved for " + latest.studentId + ".", tone:"ok"};
    dialog.close();
    renderTeacher();
    $(`[data-attempt="${id}"]`)?.focus({preventScroll:true});
  };
  $("#remove-attempt", dialog).onclick = () => confirmRemoval(item);
}

function confirmRemoval(item) {
  showDialog(`<div class="dialog-body stack">
    <h2 id="dialog-title">Remove this attempt?</h2>
    <p>This removes the imported submission and any saved marks for ${escapeHTML(item.studentId)} from this browser.</p>
    <div class="actions"><button class="btn secondary" type="button" id="keep-attempt" autofocus>Keep attempt</button><button class="btn danger" type="button" id="confirm-remove">Remove attempt</button></div>
  </div>`, true);
  $("#keep-attempt", dialog).onclick = () => markAttempt(item.id);
  $("#confirm-remove", dialog).onclick = () => {
    write(teacherKey, roster().filter(attempt => attempt.id !== item.id));
    teacherMessage = {text:"Removed the attempt for " + item.studentId + ".", tone:"ok"};
    dialog.close();
    render(true);
  };
}

function mean(values) {
  return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
}

function bar(label, value, max) {
  const width = value === null ? 0 : Math.max(0, Math.min(100, value / max * 100));
  return `<div class="bar-row"><span>${label}</span><div class="bar-track" aria-hidden="true"><span style="width:${width}%"></span></div><strong>${value === null ? "—" : displayNumber(width) + "%"}</strong></div>`;
}

function analysisContent(attempts) {
  if (!attempts.length) return empty("No performance data yet","Import student work in Collected marks to see section averages and question accuracy.");
  const selected = attempts.filter(item => groupMatches(item, analysisGroup));
  const grades = selected.filter(item => item.grade);
  const scored = selected.map(item => ({score:scoreAnswers(item.answers), item}));
  const subtotal = mean(scored.map(({score}) => score.filter(Boolean).length));
  const avgEssay = mean(grades.map(item => item.grade.mark));
  const avgTotal = mean(grades.map(total));
  const itemStats = KEY.map((accepted,i) => {
    const correct = scored.filter(({score}) => score[i]).length;
    return {q:i+1, correct, blank:selected.filter(item => !item.answers[i].trim()).length, accepted};
  });
  const weakest = [...itemStats].sort((a,b) => a.correct - b.correct || a.q - b.q).slice(0,5);
  const sectionMarks = SECTIONS.slice(0,4).map((_,index) => mean(scored.map(({score}) => sectionScores(score)[index])));
  return `
    <div class="stack">
      <div class="toolbar"><label for="analysis-class">Class</label><select id="analysis-class">${classOptions(attempts, analysisGroup)}</select></div>
      ${!selected.length ? empty("No attempts for this class", "Choose another class to view its performance.") : `
      <div class="stats">
        ${stat("Attempts", selected.length, "In this class selection")}
        ${stat("Short-answer average", markLabel(subtotal,40), "All attempts")}
        ${stat("Essay average", markLabel(avgEssay,60), grades.length + " marked")}
        ${stat("Overall average", markLabel(avgTotal,100), grades.length + " with final marks")}
      </div>
      <p class="small muted">Averages count each submitted attempt. Essay and overall averages use attempts with a saved essay mark.</p>
      <div class="split">
        <section class="panel stack" aria-labelledby="sections-summary">
          <h2 id="sections-summary">Section averages</h2>
          ${SECTIONS.map((item,i) => bar(item.name, i === 4 ? avgEssay : sectionMarks[i], item.marks)).join("")}
        </section>
        <section class="panel stack" aria-labelledby="questions-summary">
          <h2 id="questions-summary">Lowest accuracy</h2>
          ${weakest.map(item => bar("Question " + item.q, item.correct, selected.length)).join("")}
        </section>
      </div>
      <section class="panel stack" aria-labelledby="essay-summary">
        <h2 id="essay-summary">Essay topics</h2>
        <div class="table-wrap"><table>
          <caption class="sr-only">Essay selections and marks by topic</caption>
          <thead><tr><th scope="col">Topic</th><th scope="col">Attempts</th><th scope="col">Below 250 words</th><th scope="col">Marked</th><th scope="col">Average mark</th></tr></thead>
          <tbody>${["A","B",""].map(letter => {
            const items = selected.filter(item => item.topic === letter);
            const marks = items.filter(item => item.grade).map(item => item.grade.mark);
            return `<tr><th scope="row">${letter ? "Topic " + letter + " · " + TOPICS[letter].name : "No topic selected"}</th><td>${items.length}</td>
            <td>${items.filter(item => words(item.essay) < MIN_WORDS).length}</td><td>${marks.length}</td><td>${markLabel(mean(marks),60)}</td></tr>`;
          }).join("")}</tbody>
        </table></div>
      </section>
      <section class="panel stack" aria-labelledby="full-question-summary"><h2 id="full-question-summary">Question accuracy</h2>
        <div class="table-wrap"><table>
          <caption class="sr-only">Short-answer performance for all 40 questions</caption>
          <thead><tr><th scope="col">Question</th><th scope="col">Accepted answers</th><th scope="col">Correct</th><th scope="col">Blank</th><th scope="col">Accuracy</th></tr></thead>
          <tbody>${itemStats.map(item => `<tr><th scope="row">${item.q}</th><td>${item.accepted.join(" / ")}</td>
          <td>${item.correct} / ${selected.length}</td><td>${item.blank}</td><td>${displayNumber(item.correct / selected.length * 100)}%</td></tr>`).join("")}</tbody>
        </table></div>
      </section>`}
    </div>`;
}

function referenceContent() {
  return `<div class="stack">
    <section class="panel stack" aria-labelledby="key-title">
      <h2 id="key-title">Sections 1–4 answer key</h2>
      <p class="muted small">Each accepted answer earns 1 mark. Spelling must match the key. Capitalisation and surrounding spaces are ignored.</p>
      <div>${SECTIONS.slice(0,4).map((item,index) => `<details>
        <summary>Section ${index+1} · ${item.name}</summary>
        <div class="key-grid" style="margin-top:9px">${KEY.slice(index*10,index*10+10).map((accepted,i) => `<div><strong>${index*10+i+1}</strong> · ${accepted.join(" / ")}</div>`).join("")}</div>
      </details>`).join("")}</div>
    </section>
    <section class="panel stack" aria-labelledby="models-title">
      <h2 id="models-title">Section 5 model essays</h2>
      <p class="small muted">Original practice examples showing different responses to the same prompt.</p>
      ${Object.entries(TOPICS).map(([letter, topic]) => `<section class="stack-tight">
        <h3>Topic ${letter} · ${topic.name}</h3><p class="muted">${escapeHTML(topic.prompt)}</p>
        <div>${MODELS[letter].map(model => `<details>
          <summary>${escapeHTML(model.title)}</summary>
          <p class="small muted" style="margin-top:6px">${model.stance} · ${words(model.text)} words</p>
          <p class="essay-copy">${escapeHTML(model.text)}</p>
        </details>`).join("")}</div>
      </section>`).join("")}
    </section>
  </div>`;
}

function tick() {
  const attempt = student();
  if (attempt?.status !== "active") return;
  if (attempt.deadline <= Date.now()) {
    finalize(attempt, true);
    return;
  }
  const clock = $("#clock", screen);
  if (clock) {
    clock.textContent = currentClock(attempt.deadline);
    clock.parentElement.classList.toggle("urgent", attempt.deadline - Date.now() <= 5 * 60 * 1000);
  }
}

$("#home-link").onclick = () => navigate("home");
$("#student-link").onclick = () => navigate("student");
$("#teacher-link").onclick = () => navigate("teacher");
window.addEventListener("storage", event => {
  if (event.key === studentKey && view === "student" && !newAttempt) {
    if (dialog.open) dialog.close();
    renderStudent();
  }
  if (event.key === teacherKey && view === "teacher" && !dialog.open) renderTeacher();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
tick();
render();
setInterval(tick,1000);
</script>
</body>
</html>
